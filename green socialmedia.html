<!DOCTYPE html>
<html>
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<style>
body {
    background-color: hsl(0, 0%, 8%);
    color: white;
    display: flex;
    font-family: "Inter", sans-serif;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.Card {
    background-color: hsl(0, 0%, 12%);
    text-align: center;
    height: auto;
    padding: 20px;
    border-radius: 10px;
}
img {
    border-radius: 100px;
}
h6 {
    color: hsl(75, 94%, 57%);
}
.choice {
    background-color: hsl(0, 0%, 20%);
    border-radius: 5px;
    padding: 10px;
    margin: 10px;
}
.choice:hover {
    background-color: hsl(75, 94%, 57%);
    color: black;
}
</style>
</head>

<body>
    <div class="Card">
        <img src="https://i.ibb.co/21cz7YsH/avatar-jessica.jpg" alt="avatar jessica">
        <h2>Jessica Randall</h2>
        <h6>London, United Kingdom</h6>
        <p>"Front-end developer and avid reader."</p>
        <div class="choice">GitHub</div>
        <div class="choice">Frontend Mentor</div>
        <div class="choice">LinkedIn</div>
        <div class="choice">Twitter</div>
        <div class="choice">Instagram</div>
    </div>

</body>

</html>
